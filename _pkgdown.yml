url: https://paulgovan.github.io/ReliaPlotR/
template:
  bootstrap: 5

navbar:
  logo:
    image: man/figures/logo.png
    href: https://paulgovan.github.io/ReliaPlotR/

articles:
  - title: "Tutorials"
    navbar: ~
    contents:
      - weibull
      - alt
      - rga
      - repairable
      - mcp

reference:
  - title: "Life Data Analysis"
    desc: >
      Weibull and lognormal probability plots and confidence contour plots
      for fitting failure-time data.
    contents:
      - plotly_wblr
      - plotly_contour

  - title: "Accelerated Life Testing"
    desc: >
      Probability plots and life-stress relationship plots for multi-stress
      ALT experiments.
    contents:
      - plotly_alt
      - plotly_rel

  - title: "Reliability Growth"
    desc: >
      Crow-AMSAA NHPP and Duane cumulative-failure / MTBF plots for
      tracking improvement over development test time.
    contents:
      - plotly_rga
      - plotly_duane

  - title: "Repairable Systems"
    desc: >
      Nonparametric and parametric plots for repairable-system event data:
      NHPP model fits, Mean Cumulative Function, and exposure rates.
    contents:
      - plotly_nhpp
      - plotly_mcf
      - plotly_exposure

  - title: "Accessor Functions"
    desc: >
      Extract tidy data frames of parameter estimates, confidence bounds, and
      goodness-of-fit metrics from fitted model objects for use in
      reproducible research workflows.
    contents:
      - tidy_wblr
      - tidy_rga
      - tidy_alt

  - title: "MCP Server"
    desc: >
      Launch a Model Context Protocol server that exposes Weibull and ALT
      fitting as callable tools for AI assistants such as Claude Code and
      Claude Desktop.
    contents:
      - reliapltr_mcp_server
